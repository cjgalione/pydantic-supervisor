name: Daily modal queries
on:
  schedule:
    # Avoid the top of the hour, when GitHub Actions scheduled runs are most
    # likely to be delayed or dropped under load.
    - cron: "17 6 * * *"  # daily at 06:17 UTC
  workflow_dispatch:
    inputs:
      num_questions:
        description: "Number of questions to generate for this manual run"
        required: false
        default: "100"
      model_pool:
        description: "Comma-separated model IDs for batch routing (e.g. moonshotai/Kimi-K2.5)"
        required: false
        default: "moonshotai/Kimi-K2.5"
      question_source:
        description: "Question source: generated or bank"
        required: false
        default: "bank"
      per_question_timeout_seconds:
        description: "Timeout per question in seconds"
        required: false
        default: "120"
      trace_profile:
        description: "Trace profile: lean or full"
        required: false
        default: "lean"

jobs:
  run-queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version-file: ".python-version"

      - name: Validate required secrets
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          missing=0
          for name in BRAINTRUST_API_KEY TAVILY_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies with uv
        run: uv pip install -r requirements.txt --system

      - name: Run queries
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: pydantic-supervisor
          BRAINTRUST_ORG_NAME: Braintrust Demos
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Route OpenAI SDK calls through the Braintrust gateway so all LLM
          # traffic is logged in traces. Anthropic models are routed at the code
          # level in resolve_model_name() since the Anthropic SDK's URL
          # construction is incompatible with the gateway's endpoint structure.
          OPENAI_BASE_URL: "https://gateway.braintrust.dev/v1/proxy"
          OPENAI_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          NUM_QUESTIONS: ${{ github.event.inputs.num_questions || '100' }}
          CONCURRENCY: 1
          MAX_RETRIES: 3
          BASE_RETRY_SECONDS: 15
          INTER_QUESTION_DELAY_SECONDS: 2
          TRACE_PROFILE: ${{ github.event.inputs.trace_profile || 'full' }}
          BRAINTRUST_SYNC_FLUSH: 1
          MODEL_POOL: ${{ github.event.inputs.model_pool || 'gpt-4.1-mini' }}
          QUESTION_SOURCE: ${{ github.event.inputs.question_source || 'bank' }}
          PER_QUESTION_TIMEOUT_SECONDS: ${{ github.event.inputs.per_question_timeout_seconds || '120' }}
          PYTHONUNBUFFERED: 1
        run: |
          uv run python scripts/run_queries.py --num-questions "$NUM_QUESTIONS" --fail-on-error
